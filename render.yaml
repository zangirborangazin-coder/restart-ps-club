services:
  - type: web
    name: restart-ps-club
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restart-ps-club-db
          property: connectionString

databases:
  - name: restart-ps-club-db
    databaseName: restart_ps_club
    user: restart_ps_club
