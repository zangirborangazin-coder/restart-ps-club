<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Неоновый градиент PlayStation -->
    <linearGradient id="ps-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00439C" />
      <stop offset="50%" stop-color="#0070D1" />
      <stop offset="100%" stop-color="#A100FF" />
    </linearGradient>
  </defs>

  <!-- Темный фоновый круг для четкости на любой теме браузера -->
  <circle cx="256" cy="256" r="240" fill="#0F111A" stroke="url(#ps-glow)" stroke-width="16"/>

  <!-- Силуэт геймпада -->
  <path d="M160 160 C130 160 100 180 88 220 L56 330 C44 370 68 400 104 400 C130 400 150 380 168 350 L200 300 L312 300 L344 350 C362 380 382 400 408 400 C444 400 468 370 456 330 L424 220 C412 180 382 160 352 160 Z" 
        fill="none" 
        stroke="url(#ps-glow)" 
        stroke-width="28" 
        stroke-linejoin="round"/>

  <!-- Символ RESTART / POWER в центре геймпада -->
  <path d="M256 210 A 45 45 0 1 1 211 255" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="16" 
        stroke-linecap="round"/>
  
  <!-- Стрелка перезагрузки -->
  <polygon points="211,225 211,260 235,242.5" fill="#ffffff"/>
</svg>
